<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currencies=['EUR','USD','GBP','CHF','CAD','AUD','NZD','SEK','NOK','DKK','PLN','CZK','HUF','RON'];
let loadedGroup=null;
let db=null,user=null,profile=null,groups=[],active=null,view='expenses',snapshot={members:[],expenses:[],splits:[],settlements:[]},demo=false,authMode='signin',busy=false,refreshing=false,loadEpoch=0;
const demoStore={}; let inviteToken=new URL(location.href).searchParams.get('invite')||sessionStorage.getItem('sc_invite')||'';
if(inviteToken)sessionStorage.setItem('sc_invite',inviteToken);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function cents(v){const s=String(v).trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(s))throw Error('Use a positive amount with at most two decimal places.');const [a,b='']=s.split('.');const n=Number(a)*100+Number(b.padEnd(2,'0'));if(!Number.isSafeInteger(n)||n>100000000)throw Error('Maximum amount is 1,000,000.00.');return n;}
function money(n,c=active?.currency||'EUR'){return new Intl.NumberFormat(undefined,{style:'currency',currency:c,minimumFractionDigits:2,maximumFractionDigits:2}).format(n/100);}
function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function name(id){const m=snapshot.members.find(m=>m.user_id===id);if(!m)return 'Member';const duplicate=snapshot.members.filter(x=>x.display_name===m.display_name).length>1;return m.display_name+(id===user?.id?' (you)':duplicate?' · '+id.slice(0,4):'');}
function initials(n){return n.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();}
function options(selected){return snapshot.members.map(m=>`<option value="${esc(m.user_id)}" ${m.user_id===selected?'selected':''}>${esc(name(m.user_id))}</option>`).join('');}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),4000);}
function message(t,kind='error'){$('globalMessage').innerHTML=t?`<div class="${kind}" style="margin-bottom:20px">${esc(t)}</div>`:'';}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('dialog').showModal();}
function closeModal(){if(!busy)$('dialog').close();}
$('closeDialog').onclick=closeModal;$('dialog').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
function errorText(e){return e?.message||'Something went wrong. Please try again.';}
async function rpc(fn,args){const {data,error}=await db.rpc(fn,args);if(error)throw error;return data;}
async function formTask(form,task){if(busy)return;busy=true;const buttons=[...form.querySelectorAll('button,input,select')],disabledBefore=buttons.map(b=>b.disabled);buttons.forEach(b=>b.disabled=true);const err=form.querySelector('[data-error]');if(err)err.innerHTML='';try{await task();}catch(e){if(err)err.innerHTML=`<div class="error">${esc(errorText(e))}</div>`;else message(errorText(e));}finally{busy=false;buttons.forEach((b,i)=>b.disabled=disabledBefore[i]);}}
function balance(data=snapshot){const b=Object.fromEntries(data.members.map(m=>[m.user_id,0]));data.expenses.forEach(e=>{b[e.paid_by]+=Number(e.amount_cents);});data.splits.forEach(s=>{b[s.user_id]-=Number(s.amount_cents);});data.settlements.forEach(s=>{b[s.from_user]+=Number(s.amount_cents);b[s.to_user]-=Number(s.amount_cents);});return b;}
function suggested(b){let owes=Object.entries(b).filter(([,n])=>n<0).map(([id,n])=>({id,n:-n})),gets=Object.entries(b).filter(([,n])=>n>0).map(([id,n])=>({id,n})),out=[];owes.sort((a,b)=>b.n-a.n);gets.sort((a,b)=>b.n-a.n);let i=0,j=0;while(i<owes.length&&j<gets.length){const amount=Math.min(owes[i].n,gets[j].n);out.push({from:owes[i].id,to:gets[j].id,amount});owes[i].n-=amount;gets[j].n-=amount;if(!owes[i].n)i++;if(!gets[j].n)j++;}return out;}
function equalShares(total,ids){const q=Math.floor(total/ids.length),r=total%ids.length;return ids.map((id,i)=>({user_id:id,amount_cents:q+(i<r?1:0)}));}
function canEdit(record){return record.created_by===user.id||active.owner_id===user.id;}
function renderAccount(){$('account').innerHTML=user?`<span class="accountname muted smalltext">${esc(profile?.display_name||'')}</span><button class="secondary small" id="profileButton">Profile</button><button class="ghost small" id="logout">${demo?'Exit demo':'Sign out'}</button>`:'';if(user){$('profileButton').onclick=profileModal;$('logout').onclick=async()=>{if(busy)return;if(!demo){const {error}=await db.auth.signOut();if(error){message(error.message);return;}}reset();};}}
function reset(){loadedGroup=null;loadEpoch++;user=null;profile=null;groups=[];active=null;demo=false;view='expenses';$('dialog').close();renderAccount();renderAuth();}
function renderAuth(){renderAccount();if(!db&&!demo){$('main').innerHTML=`<section class="auth"><div class="panel"><div class="eyebrow">Shared expenses</div><h1>Every trip.<br>Fairly split.</h1><p class="muted">Keep your group's expenses and balances together.</p><div class="banner">The live app is waiting for its Supabase connection. You can explore a sample group now.</div><button class="full" id="tryDemo">Explore the demo</button><p class="note">Demo changes disappear when you reload. Follow SETUP.md to enable real accounts and saved groups.</p></div></section>`;$('tryDemo').onclick=startDemo;return;}
const signup=authMode==='signup',recovery=authMode==='recovery',forgot=authMode==='forgot',resend=authMode==='resend';
$('main').innerHTML=`<section class="auth"><div class="panel"><div class="eyebrow">Shared expenses</div><h1>${signup?'Create your account':recovery?'Choose a new password':forgot?'Reset your password':resend?'Confirm your email':'Welcome back'}</h1><p class="muted">${signup?'One profile. As many groups as you need.':recovery?'Use at least 8 characters.':forgot?'We’ll email you a password reset link.':resend?'Request a fresh link, then open the newest email.':'Sign in to see your groups.'}</p>${inviteToken?'<div class="banner invitebanner">You have a group invitation. Sign in or create an account to join.</div>':''}<form id="authForm">${signup?'<label for="displayName">Your name</label><input id="displayName" autocomplete="name" maxlength="80" required>':''}${!recovery?'<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>':''}${!forgot&&!resend?`<label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="${signup||recovery?'new-password':'current-password'}" required>`:''}<div data-error style="margin-top:15px"></div><button type="submit">${signup?'Create account':forgot?'Send reset link':recovery?'Save password':resend?'Send confirmation email':'Sign in'}</button></form><div class="row authlinks wrap">${!recovery?`<button id="switchAuth">${signup||forgot||resend?'Back to sign in':'Create account'}</button>${!signup&&!forgot&&!resend?'<button id="forgotPassword">Forgot password?</button>':''}${!forgot&&!resend?'<button id="resendConfirmation">Resend confirmation email</button>':''}`:''}</div></div></section>`;
if($('switchAuth'))$('switchAuth').onclick=()=>{authMode=signup||forgot||resend?'signin':'signup';renderAuth();};if($('resendConfirmation'))$('resendConfirmation').onclick=()=>{authMode='resend';message('');renderAuth();};if($('forgotPassword'))$('forgotPassword').onclick=()=>{authMode='forgot';renderAuth();};
$('authForm').onsubmit=e=>{e.preventDefault();const email=$('email')?.value.trim(),password=$('password')?.value,display=$('displayName')?.value.trim();formTask(e.currentTarget,async()=>{const redirect=location.origin+location.pathname;
if(resend){const {error}=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:redirect}});if(error)throw error;message('If this account needs confirmation, a fresh email has been requested. Open only the newest link. You can also try signing in if your email was already confirmed.','success');return;}
if(forgot){const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(error)throw error;message('If this email has an account, a reset link has been sent.','success');return;}
if(recovery){const {error}=await db.auth.updateUser({password});if(error)throw error;authMode='signin';toast('Password updated.');await initializeUser();return;}
if(signup){const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:display},emailRedirectTo:redirect}});if(error)throw error;if(!data.session){message('Check your email to confirm your account, then sign in.','success');return;}}
else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;}await initializeUser();});};}
async function initializeUser(){const {data,error}=await db.auth.getSession();if(error)throw error;user=data.session?.user;if(!user){reset();return;}const p=await db.from('sc_profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;profile=p.data;if(!profile){const n=(user.user_metadata?.display_name||user.email?.split('@')[0]||'Member').slice(0,80);await rpc('sc_save_profile',{p_name:n});profile={id:user.id,display_name:n};}await refresh();}
async function refresh(){if(refreshing||!user)return;refreshing=true;const epoch=loadEpoch;try{if(!demo){const {data,error}=await db.from('sc_groups').select('*').order('created_at',{ascending:false});if(error)throw error;if(epoch!==loadEpoch)return;groups=data;if(active)active=groups.find(g=>g.id===active.id)||null;if(active){const data=await rpc('sc_group_snapshot',{p_group:active.id});if(epoch!==loadEpoch)return;snapshot=data;}}else if(active){active=groups.find(g=>g.id===active.id)||null;if(active)snapshot=demoStore[active.id];}if(epoch!==loadEpoch)return;loadedGroup=active?.id||null;message('');renderApp();}catch(e){message(errorText(e));if(user)renderApp();}finally{refreshing=false;}}
async function selectGroup(id){if(busy)return;loadEpoch++;active=groups.find(g=>g.id===id);view='expenses';snapshot={members:[],expenses:[],splits:[],settlements:[]};$('main').innerHTML='<div class="loading">Loading your group…</div>';while(refreshing)await new Promise(r=>setTimeout(r,20));await refresh();}
function renderApp(){if(!user)return;renderAccount();if(active&&loadedGroup!==active.id){$('main').innerHTML='<div class="empty"><h2>Could not load this group</h2><p>Please check your connection and try again.</p><button id="retryGroup">Try again</button><button class="secondary" id="returnGroups" style="margin-left:10px">All groups</button></div>';$('retryGroup').onclick=refresh;$('returnGroups').onclick=()=>{active=null;renderApp();};return;}const b=active?balance():{},net=b[user.id]||0,total=snapshot.expenses.reduce((n,e)=>n+Number(e.amount_cents),0);
$('main').innerHTML=`${demo?'<div class="banner demo">Demo mode · sample people and expenses · changes are not saved</div>':''}${inviteToken&&!demo?'<div class="banner invitebanner row between wrap"><span>You have a group invitation.</span><button id="joinInvite" class="small">Join this group</button></div>':''}<div class="layout ${active?'hasgroup':''}"><aside class="panel sidebar"><div class="row between sidebarhead"><h2 style="margin:0">Your groups</h2><span class="muted smalltext">${groups.length}</span></div><div class="groups">${groups.map(g=>`<button class="groupitem ${g.id===active?.id?'active':''}" data-group="${g.id}"><span class="groupbadge">${esc(initials(g.name))}</span><span><strong>${esc(g.name)}</strong><small>${esc(g.currency)} · ${g.owner_id===user.id?'Created by you':'Member'}</small></span></button>`).join('')||'<p class="muted smalltext">A trip, a weekend, or your household. Give each group its own space.</p>'}</div><button class="full" id="newGroup">+ Create group</button></aside><section>${active?`<button class="navback" id="allGroups">‹ All groups</button><div class="row between detailhead wrap"><div class="grow"><div class="eyebrow">${esc(active.currency)} · ${snapshot.members.length} ${snapshot.members.length===1?'member':'members'}</div><h1 class="who">${esc(active.name)}</h1></div><div class="detailbuttons"><button class="ghost" id="refreshGroup" aria-label="Refresh group">Refresh</button><button id="addExpense">+ Expense</button></div></div><div class="summary"><div class="summarygrid"><div><div class="summarylabel muted">${net<0?'You owe':net>0?'You are owed':'Your balance'}</div><div class="net ${net<0?'owing':''}">${money(Math.abs(net))}</div><div class="muted tiny" style="margin-top:8px">${net===0?'All settled up':net<0?'Across this group':'Across this group'}</div></div><div><div class="summarylabel muted">Total group expenses</div><div class="total">${money(total)}</div><div class="muted tiny">${snapshot.expenses.length} expenses · ${snapshot.settlements.length} repayments</div></div></div></div><nav class="tabs" aria-label="Group views">${['expenses','balances','people'].map(v=>`<button class="${view===v?'active':''}" data-view="${v}" aria-current="${view===v?'page':'false'}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</nav><div id="groupContent"></div>`:`<div class="empty"><div class="groupbadge">+</div><h2>${groups.length?'Pick your group':'Start your first group'}</h2><p>${groups.length?'Open a group to add expenses and check balances.':'Create a group, invite your people, and start splitting expenses.'}</p><button id="emptyCreate">Create group</button></div>`}</section></div>`;
$('newGroup').onclick=groupModal;if($('emptyCreate'))$('emptyCreate').onclick=groupModal;document.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>selectGroup(el.dataset.group));
if($('joinInvite'))$('joinInvite').onclick=async()=>{const button=$('joinInvite');button.disabled=true;try{const id=await rpc('sc_join_group',{p_token:inviteToken});inviteToken='';sessionStorage.removeItem('sc_invite');const u=new URL(location.href);u.searchParams.delete('invite');history.replaceState(null,'',u);active={id};await refresh();toast('You joined the group.');}catch(e){message(errorText(e));button.disabled=false;}};
if(active){$('allGroups').onclick=()=>{loadEpoch++;active=null;renderApp();};$('refreshGroup').onclick=refresh;$('addExpense').onclick=()=>expenseModal();document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;renderApp();});renderContent();}}
function renderContent(){if(view==='expenses'){const es=snapshot.expenses; $('groupContent').innerHTML=es.length?`<div class="list">${es.map(e=>{const my=snapshot.splits.find(s=>s.expense_id===e.id&&s.user_id===user.id);return `<article class="item"><div class="row between"><div class="grow"><div class="itemtitle">${esc(e.description)}</div><div class="itemmeta">${esc(name(e.paid_by))} paid · ${dateText(e.expense_date)}</div></div><div class="amount">${money(e.amount_cents)}</div></div><div class="row between wrap" style="margin-top:12px"><span class="muted smalltext">Your share: ${money(my?.amount_cents||0)}</span>${canEdit(e)?`<button class="secondary small" data-edit="${e.id}">Edit</button>`:''}</div></article>`;}).join('')}</div>`:'<div class="empty"><h2>No expenses yet</h2><p>Add the first meal, hotel, or ticket. Choose who paid and who shares it.</p><button id="firstExpense">Add expense</button></div>';if($('firstExpense'))$('firstExpense').onclick=()=>expenseModal();document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>expenseModal(snapshot.expenses.find(e=>e.id===el.dataset.edit)));}
else if(view==='balances'){const b=balance(),s=suggested(b);$('groupContent').innerHTML=`<div class="list">${snapshot.members.map(m=>`<div class="item row between"><div class="row grow"><div class="avatar">${esc(initials(m.display_name))}</div><div class="grow"><strong class="who">${esc(name(m.user_id))}</strong><div class="itemmeta">${b[m.user_id]<0?'Owes':b[m.user_id]>0?'Is owed':'Settled up'}</div></div></div><span class="amount ${b[m.user_id]<0?'negative':'positive'}">${money(Math.abs(b[m.user_id]))}</span></div>`).join('')}</div><div class="row between sectionhead wrap"><h2 style="margin:0">Suggested repayments</h2><button class="ghost small" id="recordPayment" ${snapshot.members.length<2?'disabled':''}>Record repayment</button></div><p class="note" style="margin-bottom:15px">Suggestions simplify the group's balances. Record a repayment after the money has been transferred.</p><div class="list">${s.map((x,i)=>`<div class="item"><div class="row between wrap"><div class="grow"><strong>${esc(name(x.from))}</strong><div class="itemmeta">Pays ${esc(name(x.to))}</div></div><span class="amount">${money(x.amount)}</span><button class="small secondary" data-settle="${i}">Record</button></div></div>`).join('')||'<div class="item muted">Everyone is settled up.</div>'}</div>${snapshot.settlements.length?`<h2 class="sectionhead">Recorded repayments</h2><div class="list">${snapshot.settlements.map(x=>`<div class="item row between wrap"><div class="grow"><div class="itemtitle">${esc(name(x.from_user))} paid ${esc(name(x.to_user))}</div><div class="itemmeta">${dateText(x.settlement_date)}</div></div><span class="amount">${money(x.amount_cents)}</span>${canEdit(x)?`<button class="danger small" data-delete-payment="${x.id}">Delete</button>`:''}</div>`).join('')}</div>`:''}`;$('recordPayment').onclick=()=>settlementModal();document.querySelectorAll('[data-settle]').forEach(el=>el.onclick=()=>settlementModal(s[Number(el.dataset.settle)]));document.querySelectorAll('[data-delete-payment]').forEach(el=>el.onclick=()=>deleteModal('repayment',el.dataset.deletePayment));}
else{$('groupContent').innerHTML=`<div class="row between wrap sectionhead"><h2 style="margin:0">Group members</h2>${active.owner_id===user.id?'<button id="invitePerson" class="small">Invite someone</button>':''}</div><div class="list">${snapshot.members.map(m=>`<div class="item row"><div class="avatar">${esc(initials(m.display_name))}</div><div class="grow"><strong class="who">${esc(name(m.user_id))}</strong><div class="itemmeta">${m.user_id===active.owner_id?'Group owner':'Member'}</div></div></div>`).join('')}</div><p class="note">All members can add expenses and repayments. The owner can invite people and edit all entries; members can edit or delete their own entries.</p>${active.owner_id===user.id?'<button class="ghost small" id="revokeInvites" style="margin-top:18px">Revoke unused invitations</button>':''}`;if($('invitePerson'))$('invitePerson').onclick=inviteModal;if($('revokeInvites'))$('revokeInvites').onclick=revokeModal;}}
function groupModal(){modal('Create a group',`<form id="groupForm"><label for="groupName">Group name</label><input id="groupName" placeholder="Summer in Croatia" maxlength="100" required><label for="currency">Currency</label><select id="currency">${currencies.map(c=>`<option>${c}</option>`).join('')}</select><p class="note">Use one currency for all entries in this group. Currency conversion is not included.</p><div data-error style="margin-top:15px"></div><div class="actions"><button class="secondary" type="button" id="cancelGroup">Cancel</button><button type="submit">Create group</button></div></form>`);$('cancelGroup').onclick=closeModal;$('groupForm').onsubmit=e=>{e.preventDefault();const n=$('groupName').value.trim(),c=$('currency').value;formTask(e.currentTarget,async()=>{if(!n)throw Error('Enter a group name.');let id;if(demo){id=crypto.randomUUID();groups.unshift({id,name:n,currency:c,owner_id:user.id});demoStore[id]={members:[{user_id:user.id,display_name:profile.display_name}],expenses:[],splits:[],settlements:[]};}else id=await rpc('sc_create_group',{p_name:n,p_currency:c});active={id};$('dialog').close();await refresh();toast('Group created. Invite people in the People tab.');});};}
function profileModal(){modal('Your profile',`<form id="profileForm"><label for="profileName">Display name</label><input id="profileName" value="${esc(profile.display_name)}" maxlength="80" required>${!demo?`<p class="note">${esc(user.email)}</p>`:''}<div data-error style="margin-top:15px"></div><div class="actions"><button type="submit">Save profile</button></div></form>`);$('profileForm').onsubmit=e=>{e.preventDefault();const n=$('profileName').value.trim();formTask(e.currentTarget,async()=>{if(!n)throw Error('Enter your name.');if(!demo)await rpc('sc_save_profile',{p_name:n});else Object.values(demoStore).forEach(s=>{const m=s.members.find(m=>m.user_id===user.id);if(m)m.display_name=n;});profile.display_name=n;$('dialog').close();await refresh();toast('Profile updated.');});};}
function expenseModal(expense){const id=expense?.id||crypto.randomUUID(),old=snapshot.splits.filter(s=>s.expense_id===id);modal(expense?'Edit expense':'Add expense',`<form id="expenseForm"><label for="description">What was it for?</label><input id="description" placeholder="Dinner by the sea" maxlength="160" value="${esc(expense?.description||'')}" required><div class="formgrid"><div><label for="amount">Amount (${active.currency})</label><input id="amount" type="text" inputmode="decimal" placeholder="0.00" value="${expense?(expense.amount_cents/100).toFixed(2):''}" required></div><div><label for="expenseDate">Date</label><input id="expenseDate" type="date" value="${expense?.expense_date||today()}" required></div></div><label for="paidBy">Paid by</label><select id="paidBy">${options(expense?.paid_by||user.id)}</select><label for="splitType">Split between</label><select id="splitType"><option value="equal">Equally</option><option value="custom" ${expense?'selected':''}>Custom amounts</option></select><div id="splitRows">${snapshot.members.map(m=>{const s=old.find(s=>s.user_id===m.user_id);return `<div class="splitrow"><label><input type="checkbox" data-participant="${m.user_id}" ${!expense||s?'checked':''}>${esc(name(m.user_id))}</label><input aria-label="Share for ${esc(name(m.user_id))}" inputmode="decimal" type="text" data-share="${m.user_id}" value="${s?(s.amount_cents/100).toFixed(2):'0.00'}"></div>`;}).join('')}</div><p class="note" id="splitNote"></p><div data-error style="margin-top:15px"></div><div class="actions wrap">${expense?'<button type="button" id="deleteExpense" class="danger">Delete</button>':''}<button type="button" id="cancelExpense" class="secondary">Cancel</button><button type="submit">Save expense</button></div></form>`);
const update=()=>{const equal=$('splitType').value==='equal',ids=[...document.querySelectorAll('[data-participant]:checked')].map(e=>e.dataset.participant);let total=0;try{total=cents($('amount').value);}catch{}const shares=ids.length?equalShares(total,ids):[];document.querySelectorAll('[data-share]').forEach(el=>{el.disabled=equal||!ids.includes(el.dataset.share);if(equal)el.value=((shares.find(s=>s.user_id===el.dataset.share)?.amount_cents||0)/100).toFixed(2);});let sum=0;if(!equal){try{sum=ids.reduce((n,id)=>n+cents(document.querySelector(`[data-share="${id}"]`).value),0);}catch{}}$('splitNote').textContent=equal?`${ids.length} participants · any extra cent goes to the first selected member(s).`:`Assigned ${money(sum)} of ${money(total)} · remaining ${money(total-sum)}`;};
$('splitType').onchange=update;$('amount').oninput=update;document.querySelectorAll('[data-participant]').forEach(el=>el.onchange=update);document.querySelectorAll('[data-share]').forEach(el=>el.oninput=update);update();$('cancelExpense').onclick=closeModal;if($('deleteExpense'))$('deleteExpense').onclick=()=>deleteModal('expense',id);
$('expenseForm').onsubmit=e=>{e.preventDefault();const description=$('description').value.trim(),amount=$('amount').value,paid=$('paidBy').value,date=$('expenseDate').value,ids=[...document.querySelectorAll('[data-participant]:checked')].map(el=>el.dataset.participant),type=$('splitType').value,raw=ids.map(id=>({user_id:id,value:document.querySelector(`[data-share="${id}"]`).value}));formTask(e.currentTarget,async()=>{if(!description)throw Error('Enter a description.');const total=cents(amount);if(!total)throw Error('Amount must be greater than zero.');if(!ids.length)throw Error('Select at least one participant.');const splits=type==='equal'?equalShares(total,ids):raw.map(s=>({user_id:s.user_id,amount_cents:cents(s.value)}));if(splits.reduce((n,s)=>n+s.amount_cents,0)!==total)throw Error('Custom shares must add up to the total.');if(demo){const record={id,group_id:active.id,description,amount_cents:total,paid_by:paid,created_by:expense?.created_by||user.id,expense_date:date};snapshot.expenses=snapshot.expenses.filter(e=>e.id!==id);snapshot.expenses.unshift(record);snapshot.splits=snapshot.splits.filter(s=>s.expense_id!==id).concat(splits.map(s=>({...s,expense_id:id,group_id:active.id})));}else{const args={p_id:id,p_group:active.id,p_description:description,p_amount:total,p_paid_by:paid,p_date:date,p_splits:splits};await rpc('sc_save_expense',args);}$('dialog').close();await refresh();toast('Expense saved.');});};}
function settlementModal(s){const id=crypto.randomUUID();modal('Record a repayment',`<form id="settlementForm"><p class="note">This records a transfer you have already made. SplitCircle does not move money.</p><label for="fromPerson">Paid by</label><select id="fromPerson">${options(s?.from||user.id)}</select><label for="toPerson">Paid to</label><select id="toPerson">${options(s?.to||snapshot.members.find(m=>m.user_id!==user.id)?.user_id)}</select><div class="formgrid"><div><label for="repaymentAmount">Amount (${active.currency})</label><input id="repaymentAmount" inputmode="decimal" value="${s?(s.amount/100).toFixed(2):''}" required></div><div><label for="repaymentDate">Date</label><input type="date" id="repaymentDate" value="${today()}" required></div></div><div data-error style="margin-top:15px"></div><div class="actions"><button type="button" class="secondary" id="cancelRepayment">Cancel</button><button type="submit">Record repayment</button></div></form>`);$('cancelRepayment').onclick=closeModal;$('settlementForm').onsubmit=e=>{e.preventDefault();const from=$('fromPerson').value,to=$('toPerson').value,raw=$('repaymentAmount').value,date=$('repaymentDate').value;formTask(e.currentTarget,async()=>{const amount=cents(raw);if(!amount)throw Error('Amount must be greater than zero.');if(from===to)throw Error('Choose two different members.');if(demo)snapshot.settlements.unshift({id,group_id:active.id,from_user:from,to_user:to,amount_cents:amount,settlement_date:date,created_by:user.id});else await rpc('sc_save_settlement',{p_id:id,p_group:active.id,p_from:from,p_to:to,p_amount:amount,p_date:date});$('dialog').close();await refresh();toast('Repayment recorded.');});};}
function deleteModal(kind,id){modal(`Delete ${kind}?`,`<form id="deleteForm"><p class="note">This removes the ${kind} for everyone in the group and recalculates balances.</p><div data-error style="margin-top:15px"></div><div class="actions"><button type="button" id="cancelDelete" class="secondary">Cancel</button><button type="submit" class="danger">Delete ${kind}</button></div></form>`);$('cancelDelete').onclick=closeModal;$('deleteForm').onsubmit=e=>{e.preventDefault();formTask(e.currentTarget,async()=>{if(demo){if(kind==='expense'){snapshot.expenses=snapshot.expenses.filter(e=>e.id!==id);snapshot.splits=snapshot.splits.filter(s=>s.expense_id!==id);}else snapshot.settlements=snapshot.settlements.filter(s=>s.id!==id);}else{await rpc(kind==='expense'?'sc_delete_expense':'sc_delete_settlement',{p_id:id});}$('dialog').close();await refresh();toast(`${kind==='expense'?'Expense':'Repayment'} deleted.`);});};}
function inviteModal(){if(demo){modal('Invite someone','<p class="note">Invitations are available in the connected app. The demo has three sample participants so you can explore splitting expenses.</p>');return;}modal('Invite someone',`<form id="inviteForm"><p class="note">Create a private link for one person. They will sign in or register before joining. The link expires after seven days.</p><div data-error></div><div class="actions"><button type="submit">Create invitation link</button></div></form>`);$('inviteForm').onsubmit=e=>{e.preventDefault();formTask(e.currentTarget,async()=>{const token=await rpc('sc_create_invite',{p_group:active.id});const url=new URL(location.origin+location.pathname);url.searchParams.set('invite',token);$('modalBody').innerHTML=`<p class="note">Send this link to your participant. Create a separate link for each person.</p><label for="inviteLink">Invitation link</label><input id="inviteLink" value="${esc(url.href)}" readonly><div class="actions"><button id="copyInvite">Copy link</button>${navigator.share?'<button class="secondary" id="shareInvite">Share</button>':''}</div>`;$('copyInvite').onclick=async()=>{try{await navigator.clipboard.writeText(url.href);toast('Invitation link copied.');}catch{$('inviteLink').select();toast('Select and copy the link.');}};if($('shareInvite'))$('shareInvite').onclick=async()=>{try{await navigator.share({title:`Join ${active.name} on SplitCircle`,url:url.href});}catch{}};});};}
function revokeModal(){modal('Revoke unused invitations?',`<form id="revokeForm"><p class="note">All unused invitation links for this group will stop working. Existing members keep access.</p><div data-error></div><div class="actions"><button type="button" class="secondary" id="cancelRevoke">Cancel</button><button type="submit" class="danger">Revoke invitations</button></div></form>`);$('cancelRevoke').onclick=closeModal;$('revokeForm').onsubmit=e=>{e.preventDefault();formTask(e.currentTarget,async()=>{if(!demo)await rpc('sc_revoke_invites',{p_group:active.id});$('dialog').close();toast('Unused invitations revoked.');});};}
function startDemo(){demo=true;user={id:'demo-you'};profile={display_name:'Alex'};groups=[{id:'demo-trip',name:'Weekend in Split',currency:'EUR',owner_id:user.id}];active=groups[0];demoStore[active.id]={members:[{user_id:user.id,display_name:'Alex'},{user_id:'demo-sam',display_name:'Sam'},{user_id:'demo-jamie',display_name:'Jamie'}],expenses:[{id:'demo-dinner',description:'Dinner by the sea',amount_cents:8400,paid_by:user.id,created_by:user.id,expense_date:today()},{id:'demo-stay',description:'Apartment · two nights',amount_cents:24000,paid_by:'demo-sam',created_by:'demo-sam',expense_date:today()}],splits:[],settlements:[]};snapshot=demoStore[active.id];loadedGroup=active.id;snapshot.expenses.forEach(e=>snapshot.splits.push(...equalShares(e.amount_cents,snapshot.members.map(m=>m.user_id)).map(s=>({...s,expense_id:e.id,group_id:active.id}))));view='expenses';renderApp();}
window.addEventListener('focus',()=>{if(user&&!busy&&!$('dialog').open)refresh();});
window.addEventListener('DOMContentLoaded',async()=>{const config=window.SPLITCIRCLE_CONFIG||{};if(!config.supabaseUrl||!config.supabasePublishableKey){renderAuth();return;}try{if(!window.supabase)throw Error('Could not load the sign-in service. Check your connection and reload.');db=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){authMode='recovery';renderAuth();}else if(event==='SIGNED_OUT'&&!demo){reset();}else if(event==='SIGNED_IN'&&!user&&authMode!=='recovery'&&!busy){setTimeout(()=>initializeUser().catch(e=>message(errorText(e))),0);}});const {data,error}=await db.auth.getSession();if(error)throw error;if(authMode==='recovery')return;if(data.session)await initializeUser();else renderAuth();}catch(e){renderAuth();message(errorText(e));}});
</script></body></html>
